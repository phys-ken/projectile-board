<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>水平投射シミュレーション</title>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="toast"></div>
<div id="bar">
  <button id="bReset">⟲<span class="full"> リセット</span></button>
  <button class="full" id="bBack">◀ コマ</button>
  <button id="bPlay">▶ 再生</button>
  <button class="full" id="bFwd">コマ ▶</button>
  <span class="sp full"></span>
  <button class="full" id="bStrobe">ストロボ</button>
  <button class="full" id="bVec">ベクトル</button>
  <button class="full" id="bShadow">軸への影</button>
  <button class="full" id="bLoop">くり返し</button>
  <span class="sp full"></span>
  <span class="full" id="chips" style="display:contents"></span>
  <span class="sp full"></span>
  <button class="full" id="bGear">⚙ 設定</button>
  <button class="full" id="bFull">⛶ 全画面</button>
  <button class="full" id="bMini">▼</button>
  <button class="minionly" id="bFull2">⛶</button>
  <button class="minionly" id="bUnmini">▲</button>
</div>
<div id="drawer">
  <div class="row"><button id="dClose" class="on">✕ 閉じる</button><a class="btnlink" href="./">← メニュー</a><button id="theme">黒板／白</button></div>
  <div class="item"><span class="lab">時刻</span><input type="range" id="scrub" min="0" max="1000" value="0"><span class="val" id="tval">0.00 s</span></div>
  <div class="item"><span class="lab">再生の速さ</span><span class="seg" id="speed"></span></div>
  <div class="item"><span class="lab">ストロボ間隔</span><span class="seg" id="sint"></span></div>
  <div class="item"><span class="lab">残像の出し方</span><span class="seg" id="smode"></span></div>
  <div class="row"><button id="vstrobe">ストロボ位置にもベクトル</button><button id="sline">同時刻を結ぶ</button></div>
  <div class="item"><span class="lab">高さ H</span><input type="range" id="hs" min="5" max="20" step="0.1" value="19.6"><span class="val" id="hval"></span></div>
  <div class="item"><span class="seg" id="hpre"></span></div>
  <div class="item"><span class="lab">座標</span><span class="seg" id="cmode"></span></div>
  <div id="cards" style="display:flex;flex-direction:column;gap:8px"></div>
  <div class="row"><button id="bGrid">グリッド</button><button id="bRead">数値表示</button></div>
  <div class="lab">キー：Space 再生／R 最初／←→ コマ／V ベクトル／S ストロボ／F 全画面</div>
</div>
<script src="common.js"></script>
<script>
initTheme();
const cv = $('cv'), ctx = cv.getContext('2d');
const S = {
  H: 19.6, strobe: false, dt: 0.25, smode: 'seq', vmode: 0, vstrobe: false, sline: false, coord: 'top',
  shadow: false, grid: true, readout: false,
  balls: [0, 3, 6, 9, 12].map((v) => ({ on: true, v0: v })),
};
const names = ['①', '②', '③', '④', '⑤'];
const VLAB = ['なし', 'v', 'vx vy', '全部'];
const clock = new Clock(draw);
clock.speed = 0.5;
const Tf = () => Math.sqrt(2 * S.H / G);
function syncT() { clock.T = Tf(); clock.t = Math.min(clock.t, clock.T); }
const refreshers = [];
const all = () => refreshers.forEach((f) => f());

function stepBy(n) {
  const c = clock.t / S.dt;
  const target = n > 0 ? Math.floor(c + 1e-6) + 1 : Math.ceil(c - 1e-6) - 1;
  clock.seek(clamp(target * S.dt, 0, clock.T));
}
function cycleVec() { S.vmode = (S.vmode + 1) % 4; all(); draw(); }
function toggleStrobe() { S.strobe = !S.strobe; all(); draw(); }
function setH(h) { S.H = Math.round(h * 10) / 10; $('hs').value = S.H; syncT(); all(); draw(); }

function ui() {
  wireShell();
  $('bReset').onclick = () => clock.reset();
  $('bPlay').onclick = () => clock.toggle();
  $('bFwd').onclick = () => { clock.pause(); stepBy(1); };
  $('bBack').onclick = () => { clock.pause(); stepBy(-1); };
  $('bVec').onclick = cycleVec;
  refreshers.push(() => { $('bVec').textContent = 'ベクトル：' + VLAB[S.vmode]; $('bVec').classList.toggle('on', S.vmode > 0); });
  refreshers.push(toggleBtn($('bStrobe'), () => S.strobe, (v) => { S.strobe = v; draw(); }));
  refreshers.push(toggleBtn($('bShadow'), () => S.shadow, (v) => { S.shadow = v; draw(); }));
  refreshers.push(toggleBtn($('bLoop'), () => clock.loop, (v) => { clock.loop = v; }));
  refreshers.push(toggleBtn($('bGrid'), () => S.grid, (v) => { S.grid = v; draw(); }));
  refreshers.push(toggleBtn($('bRead'), () => S.readout, (v) => { S.readout = v; draw(); }));
  $('scrub').oninput = (e) => { clock.playing = false; clock.seek(e.target.value / 1000 * clock.T); };
  refreshers.push(segment($('speed'), [['0.25×', 0.25], ['0.5×', 0.5], ['1×', 1]], () => clock.speed, (v) => (clock.speed = v)));
  refreshers.push(segment($('sint'), [['0.1', 0.1], ['0.2', 0.2], ['0.25', 0.25], ['0.5', 0.5], ['1 s', 1]], () => S.dt, (v) => { S.dt = v; draw(); }));
  refreshers.push(segment($('smode'), [['順に出す', 'seq'], ['全部出す', 'all']], () => S.smode, (v) => { S.smode = v; draw(); }));
  refreshers.push(toggleBtn($('vstrobe'), () => S.vstrobe, (v) => { S.vstrobe = v; draw(); }));
  refreshers.push(toggleBtn($('sline'), () => S.sline, (v) => { S.sline = v; draw(); }));
  refreshers.push(segment($('cmode'), [['投げた点が原点・下向き正', 'top'], ['地面が原点', 'ground']], () => S.coord, (v) => { S.coord = v; draw(); }));
  $('hs').oninput = (e) => setH(+e.target.value);
  refreshers.push(segment($('hpre'), [['4.9 m', 4.9], ['9.8 m', 9.8], ['19.6 m', 19.6]], () => S.H, setH));
  $('theme').onclick = () => { setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); all(); draw(); };
  window.addEventListener('resize', draw);
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' && e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const k = e.key;
    if (k === ' ') { e.preventDefault(); clock.toggle(); }
    else if (k === 'r' || k === 'R') clock.reset();
    else if (k === 'ArrowRight') { e.preventDefault(); clock.pause(); stepBy(1); }
    else if (k === 'ArrowLeft') { e.preventDefault(); clock.pause(); stepBy(-1); }
    else if (k === 'v' || k === 'V') cycleVec();
    else if (k === 's' || k === 'S') toggleStrobe();
    else if (k === 'f' || k === 'F') toggleFullscreen();
  });
  buildBalls();
}
function buildBalls() {
  const chips = $('chips'), box = $('cards'); chips.innerHTML = ''; box.innerHTML = '';
  S.balls.forEach((b, i) => {
    const chip = document.createElement('button'); chip.className = 'chip'; chip.textContent = names[i];
    chips.appendChild(chip);
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = `<span class="dot"></span><b style="font-size:22px">${names[i]}</b><span class="val" style="min-width:9em;text-align:left" data-lab></span><input type="range" min="0" max="15" step="0.5">`;
    const dot = c.querySelector('.dot'), sl = c.querySelector('input'), lab = c.querySelector('[data-lab]');
    sl.value = b.v0;
    const upd = () => {
      dot.style.background = theme.balls[i];
      chip.style.borderColor = theme.balls[i]; chip.style.color = b.on ? theme.balls[i] : '';
      lab.textContent = b.v0 === 0 ? '自由落下' : `v₀＝${b.v0.toFixed(1)}`;
      chip.classList.toggle('off', !b.on); c.classList.toggle('off', !b.on);
    };
    chip.onclick = () => { if (b.on && S.balls.filter((x) => x.on).length === 1) return; b.on = !b.on; all(); draw(); };
    sl.oninput = () => { b.v0 = +sl.value; all(); draw(); };
    dot.onclick = chip.onclick;
    refreshers.push(upd); box.appendChild(c); upd();
  });
}

function draw() {
  const { w, h, dpr: rdpr } = fitCanvas(cv);
  const U = Math.max(0.9 * rdpr, Math.min(w, h) / 700);
  const T = clock.T, t = clock.t, th = theme;
  $('tval').textContent = t.toFixed(2) + ' s';
  $('scrub').value = Math.round(t / T * 1000);
  $('hval').textContent = S.H.toFixed(1) + ' m';
  const playing = clock.playing;
  $('bPlay').textContent = playing ? '⏸ 止める' : (t >= T ? '⟲ もう一度' : '▶ 再生');
  ctx.fillStyle = th.bg; ctx.fillRect(0, 0, w, h);

  const act = S.balls.map((b, i) => ({ ...b, i })).filter((b) => b.on);
  const xmax = Math.max(12, Math.max(...act.map((b) => b.v0)) * Tf() + 3);
  const barH = $('bar').offsetHeight * rdpr;
  const padL = 70 * U, padR = 40 * U, padT = 46 * U, padB = barH + 34 * U, mL = 2, mTop = 0.6;
  const sc = Math.min((w - padL - padR) / (xmax + mL + 1), (h - padT - padB) / (S.H + mTop));
  const ox = padL + mL * sc, oy = padT + mTop * sc;
  const X = (x) => ox + x * sc, Y = (yd) => oy + yd * sc;
  const lw = 4 * U;
  const font = (px, style = 'bold ') => `${style}${px * U}px "BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif`;
  const top = S.coord === 'top';
  const axY = top ? 0 : S.H;

  // grid
  const minor = sc > 11 * U;
  ctx.textBaseline = 'middle';
  if (S.grid) {
    for (let k = -mL; k <= Math.floor(xmax + 1); k++) {
      const major = k % 5 === 0; if (!major && !minor) continue;
      ctx.strokeStyle = major ? th.major : th.grid; ctx.lineWidth = (major ? 1.8 : 1) * U;
      ctx.beginPath(); ctx.moveTo(X(k), Y(-mTop)); ctx.lineTo(X(k), Y(S.H)); ctx.stroke();
      if (major && k > 0) { ctx.fillStyle = th.dim; ctx.font = font(20); ctx.textAlign = 'center'; ctx.fillText(k, X(k), Y(S.H) + 20 * U); }
    }
    const vals = [];
    if (top) for (let v = 0; v <= S.H + 1e-9; v++) vals.push(v); else for (let v = 0; v <= S.H + 1e-9; v++) vals.push(v);
    vals.forEach((v) => {
      const yd = top ? v : S.H - v, major = v % 5 === 0; if (!major && !minor) return;
      ctx.strokeStyle = major ? th.major : th.grid; ctx.lineWidth = (major ? 1.8 : 1) * U;
      ctx.beginPath(); ctx.moveTo(X(-mL), Y(yd)); ctx.lineTo(X(xmax + 1), Y(yd)); ctx.stroke();
      if (major && v > 0) { ctx.fillStyle = th.dim; ctx.font = font(20); ctx.textAlign = 'right'; ctx.fillText(v, X(-mL) - 8 * U, Y(yd)); }
    });
  }

  // 台と地面
  ctx.fillStyle = th.ground; ctx.globalAlpha = 0.45; ctx.fillRect(X(-mL), Y(0), mL * sc, S.H * sc); ctx.globalAlpha = 1;
  ctx.fillStyle = th.ground; ctx.fillRect(X(-mL), Y(S.H), (xmax + 1 + mL) * sc, 12 * U);
  ctx.strokeStyle = th.ground; ctx.lineWidth = 6 * U; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(X(-mL), Y(0)); ctx.lineTo(X(0), Y(0)); ctx.stroke();

  // 座標軸（元アプリ風：白い矢印と斜体の x, y, O）
  const ax = th.axis, alw = 3.5 * U;
  arrow(ctx, X(-0.9), Y(axY), X(xmax + 0.9), Y(axY), ax, alw);
  if (top) arrow(ctx, X(0), Y(-mTop + 0.1), X(0), Y(S.H - 0.4), ax, alw);
  else arrow(ctx, X(0), Y(S.H), X(0), Y(-mTop + 0.1), ax, alw);
  ctx.fillStyle = ax; ctx.font = font(40, 'italic '); ctx.font = `italic ${40 * U}px ${SERIF}`;
  ctx.textAlign = 'center'; ctx.fillText('x', X(xmax + 0.9) + 4 * U, Y(axY) + (top ? 26 * U : -26 * U));
  ctx.textAlign = 'left'; ctx.fillText('y', X(0) + 16 * U, top ? Y(S.H) - 34 * U : Y(-mTop) + 6 * U);
  ctx.font = `${30 * U}px ${SERIF}`; ctx.textAlign = 'right'; ctx.fillText('O', X(0) - 10 * U, Y(axY) + (top ? -22 * U : 24 * U));
  // 重力
  { const gx = X(xmax - 0.5), g0 = Y(S.H * 0.30), g1 = Y(S.H * 0.30 + Math.min(3.2, S.H * 0.2));
    arrow(ctx, gx, g0, gx, g1, th.g, 6 * U);
    ctx.fillStyle = th.fg; ctx.font = `italic ${42 * U}px ${SERIF}`; ctx.textAlign = 'left'; ctx.fillText('g', gx + 18 * U, (g0 + g1) / 2); }

  const pos = (b, tt) => { const tc = Math.min(tt, T); return { x: b.v0 * tc, y: 0.5 * G * tc * tc, vx: b.v0, vy: G * tc }; };
  const R = Math.max(13 * U, 0.42 * sc);
  const ball = (p, col, a = 1) => {
    ctx.globalAlpha = a; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), R, 0, 7); ctx.fill();
    ctx.strokeStyle = th.bg; ctx.lineWidth = 2.5 * U; ctx.stroke(); ctx.globalAlpha = 1;
  };
  const shadow = (p, col, a) => {
    const bx = X(p.x), by = Y(p.y), sx = X(p.x), sy = Y(axY), tx = X(0), ty = Y(p.y);
    ctx.globalAlpha = a * 0.7; ctx.strokeStyle = col; ctx.lineWidth = 1.8 * U; ctx.setLineDash([6 * U, 6 * U]);
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(sx, sy); ctx.moveTo(bx, by); ctx.lineTo(tx, ty); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = a; ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(sx, sy, R * 0.8, 0, 7); ctx.fill(); ctx.beginPath(); ctx.arc(tx, ty, R * 0.8, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  };
  const kv = 0.2;
  const vec = (p) => {
    if (S.vmode === 0) return;
    const x0 = X(p.x), y0 = Y(p.y), ex = x0 + p.vx * kv * sc, ey = y0 + p.vy * kv * sc;
    if (S.vmode >= 2) {
      if (p.vx > 0.01) arrow(ctx, x0, y0, ex, y0, th.vx, lw);
      if (p.vy > 0.01) arrow(ctx, x0, y0, x0, ey, th.vy, lw);
    }
    if (S.vmode === 1 || S.vmode === 3) {
      if (S.vmode === 3) { ctx.setLineDash([6 * U, 6 * U]); ctx.strokeStyle = th.dim; ctx.lineWidth = U; ctx.beginPath(); ctx.moveTo(ex, y0); ctx.lineTo(ex, ey); ctx.moveTo(x0, ey); ctx.lineTo(ex, ey); ctx.stroke(); ctx.setLineDash([]); }
      if (p.vx * p.vx + p.vy * p.vy > 1e-4) arrow(ctx, x0, y0, ex, ey, th.vec, lw * 1.2);
    }
  };

  // 軌跡
  act.forEach((b) => {
    ctx.strokeStyle = th.balls[b.i]; ctx.globalAlpha = 0.6; ctx.lineWidth = 3 * U; ctx.setLineDash([3 * U, 9 * U]); ctx.lineCap = 'round';
    ctx.beginPath(); for (let k = 0; k <= 80; k++) { const p = pos(b, (Math.min(t, T) * k) / 80); k ? ctx.lineTo(X(p.x), Y(p.y)) : ctx.moveTo(X(p.x), Y(p.y)); }
    ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  });

  // ストロボ
  const times = [];
  if (S.strobe) for (let k = 1; k * S.dt <= T + 1e-9; k++) { const tt = k * S.dt; if (S.smode === 'all' || tt <= t + 1e-9) times.push(tt); }
  if (S.sline) {
    const tl = [...times]; if (t > 0 && !S.strobe) tl.push(t);
    tl.forEach((tt) => {
      const xs = act.map((b) => pos(b, tt).x), y = pos(act[0], tt).y;
      ctx.strokeStyle = th.accent; ctx.globalAlpha = 0.85; ctx.lineWidth = 2.5 * U; ctx.setLineDash([12 * U, 8 * U]);
      ctx.beginPath(); ctx.moveTo(X(0), Y(y)); ctx.lineTo(X(Math.max(...xs)), Y(y)); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
      if (S.strobe) { ctx.fillStyle = th.accent; ctx.font = font(22); ctx.textAlign = 'left'; ctx.fillText(`t＝${+tt.toFixed(2)} s`, X(Math.max(...xs)) + R + 12 * U, Y(y) - 14 * U); }
    });
  }
  times.forEach((tt) => act.forEach((b) => { const p = pos(b, tt); if (S.shadow) shadow(p, th.balls[b.i], 0.4); ball(p, th.balls[b.i], 0.55); if (S.vstrobe) vec(p); }));
  act.forEach((b) => { const p = pos(b, t); if (S.shadow) shadow(p, th.balls[b.i], 1); ball(p, th.balls[b.i]); vec(p); });

  if (S.readout) {
    const yy = pos(act[0], t).y;
    const lines = [[`t ＝ ${t.toFixed(2)} s`, 34, th.fg], [top ? `y ＝ ${yy.toFixed(1)} m（下向き）` : `高さ ＝ ${(S.H - yy).toFixed(1)} m`, 26, th.dim],
      [`vy ＝ ${(G * Math.min(t, T)).toFixed(1)} m/s`, 26, th.vy]];
    act.forEach((b) => lines.push([`${names[b.i]} x ＝ ${pos(b, t).x.toFixed(1)} m　vx ＝ ${b.v0.toFixed(1)}`, 24, th.balls[b.i]]));
    let bh = 14; lines.forEach(([, px]) => (bh += (px + 8)));
    ctx.globalAlpha = 0.85; ctx.fillStyle = th.bg; ctx.fillRect(w - 470 * U, 6 * U, 464 * U, bh * U); ctx.globalAlpha = 1;
    ctx.textBaseline = 'top'; ctx.textAlign = 'right'; let ry = 12 * U;
    lines.forEach(([s, px, col]) => { ctx.fillStyle = col; ctx.font = font(px); ctx.fillText(s, w - 16 * U, ry); ry += (px + 8) * U; });
  }
}
ui(); syncT();
{
  const q = new URLSearchParams(location.search);
  if (q.has('strobe')) S.strobe = q.get('strobe') === '1';
  if (q.has('v')) S.vmode = +q.get('v');
  if (q.has('vs')) S.vstrobe = q.get('vs') === '1';
  if (q.has('line')) S.sline = q.get('line') === '1';
  if (q.has('shadow')) S.shadow = q.get('shadow') === '1';
  if (q.has('dt')) S.dt = +q.get('dt');
  if (q.has('mode')) S.smode = q.get('mode');
  if (q.has('mini')) setMini(q.get('mini') === '1');
  if (q.has('drawer')) setDrawer(q.get('drawer') === '1');
  if (q.has('read')) S.readout = q.get('read') === '1';
  if (q.has('t')) clock.t = clamp(+q.get('t'), 0, clock.T);
  all();
}
draw();
</script>
</body></html>
